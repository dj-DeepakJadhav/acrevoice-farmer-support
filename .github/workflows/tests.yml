name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -e '.[dev]' -r requirements.txt
      - run: python -m pytest tests -q
        env:
          ACREVOICE_MODEL_PROVIDER: none
