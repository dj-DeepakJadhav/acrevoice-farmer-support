<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">AcreVoice evidence-first support flow</title>
  <desc id="desc">A farmer and adviser use the AcreVoice workspace, which links public sources, consented calls, evidence, human review and export.</desc>
  <defs><style>text{font-family:Arial,sans-serif;fill:#173b33}.title{font-size:28px;font-weight:700}.label{font-size:18px;font-weight:700}.copy{font-size:15px;fill:#436258}.small{font-size:13px;fill:#517269}.light{fill:#fff}.box{stroke:#b9d8cc;stroke-width:2}.arrow{stroke:#487e69;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#487e69"/></marker></defs>
  <rect width="1200" height="540" fill="#f7faf7"/>
  <text x="60" y="64" class="title">AcreVoice · evidence-first farmer support</text>
  <text x="60" y="94" class="copy">Guidance and phone support create a human-reviewable hand-off — never an automated eligibility decision.</text>
  <rect x="60" y="145" width="220" height="150" rx="18" fill="#e4f2eb" class="box"/><text x="86" y="190" class="label">Farmer</text><text x="86" y="220" class="copy">Chooses support topic</text><text x="86" y="245" class="copy">Gives call consent</text><text x="86" y="270" class="copy">Answers in DE or EN</text>
  <rect x="355" y="125" width="300" height="190" rx="18" fill="#143f34" class="box"/><text x="383" y="173" class="label light">AcreVoice workspace</text><text x="383" y="205" class="copy light">Public-source guidance</text><text x="383" y="232" class="copy light">Consented callback</text><text x="383" y="259" class="copy light">Evidence and audit trail</text><text x="383" y="286" class="copy light">No automated eligibility decision</text>
  <rect x="730" y="145" width="220" height="150" rx="18" fill="#fff5d8" class="box"/><text x="756" y="190" class="label">Human adviser</text><text x="756" y="220" class="copy">Reviews evidence</text><text x="756" y="245" class="copy">Approves or routes</text><text x="756" y="270" class="copy">Remains accountable</text>
  <rect x="975" y="145" width="165" height="150" rx="18" fill="#e8f0ec" class="box"/><text x="1001" y="190" class="label">Hand-off</text><text x="1001" y="220" class="copy">CSV / JSON</text><text x="1001" y="245" class="copy">Case process</text><text x="1001" y="270" class="copy">or expert route</text>
  <path d="M280 220 H350" class="arrow"/><path d="M655 220 H725" class="arrow"/><path d="M950 220 H970" class="arrow"/>
  <rect x="170" y="380" width="860" height="90" rx="16" fill="#fff" class="box"/><text x="205" y="419" class="label">Connected service layer</text><text x="205" y="447" class="small">CALL-E places the consented outbound call. Strands normalises structured evidence through Amazon Bedrock or another configured provider.</text>
</svg>
